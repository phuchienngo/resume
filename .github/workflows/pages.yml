name: Build and deploy resume

on:
  push:
    branches:
      - 'main'
    paths:
      - 'main.tex'
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile LaTeX to PDF
        run: |
          docker run --rm -v "$PWD:/pdf" -w /pdf \
            docker.io/texlive/texlive@sha256:45cdde7e87aff38479fae2ed740f1a5959d850f1ecc3fea29d4e934a44489a10 \
            latexmk -pdf \
              -shell-escape \
              -interaction=nonstopmode \
              -file-line-error \
              -pdflatex="pdflatex -synctex=1 -interaction=nonstopmode -file-line-error" \
              main.tex

      - name: Convert PDF to HTML
        run: |
          mkdir -p _site
          cp main.pdf _site/resume.pdf
          cp index.html _site/index.html
          docker run --rm -v "$PWD/_site:/pdf" -w /pdf \
            docker.io/pdf2htmlex/pdf2htmlex@sha256:83899e54f842fda9ca531aea6f30342b0cab4933a246dfc336d63b3e696c9990 \
            --zoom 1.3 --process-outline 0 resume.pdf

      - name: Open links in a new tab
        run: |
          sudo sed -i 's#<head>#<head><base target="_blank">#' _site/resume.html
          grep -c 'base target="_blank"' _site/resume.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
