name: Export PDF
on:
  workflow_dispatch:
jobs:
  build_latex:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        run: |
          docker run --rm -v "$PWD:/pdf" -w /pdf \
            docker.io/texlive/texlive@sha256:45cdde7e87aff38479fae2ed740f1a5959d850f1ecc3fea29d4e934a44489a10 \
            latexmk -pdf \
              -shell-escape \
              -interaction=nonstopmode \
              -file-line-error \
              -pdflatex="pdflatex -synctex=1 -interaction=nonstopmode -file-line-error" \
              main.tex

      - name: Rename PDF
        run: mv main.pdf resume.pdf

      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: resume.pdf

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Resume
          tag_name: v0.0.1
          files: resume.pdf
          token: ${{ secrets.CUSTOM_TOKEN }}
